
<!DOCTYPE html>
<html lang="vi">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Đăng ký tài khoản | TV</title>

    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
        rel="stylesheet"
        integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKnuqkuIAvNWLzeN8tE5YBujZqJLB"
        crossorigin="anonymous"
    >

    <!-- CSS chung giữ nguyên -->
    <link rel="stylesheet" href="css/common.css">

    <!-- Chỉ áp dụng cho trang đăng ký -->
    <link rel="stylesheet" href="css/register.css">
</head>

<body class="tv-register-body">

    <!-- HEADER GIỐNG INDEX.HTML -->
    <header class="tv-header">
        <div class="tv-container">
            <div class="tv-header-inner">

                <a href="index.html" class="tv-brand">
                    <span class="tv-logo">TV</span>
                    <span class="tv-brand-name">TV</span>
                </a>

                <nav class="tv-nav" aria-label="Điều hướng chính">
                    <a href="index.html" class="tv-nav-link">
                        Trang chủ
                    </a>

                    <a href="movies.html" class="tv-nav-link">
                        Phim
                    </a>

                    <a href="categories.html" class="tv-nav-link">
                        Thể loại
                    </a>

                    <a href="profile.html" class="tv-nav-link">
                        Tài khoản
                    </a>
                </nav>

                <div class="tv-header-actions">

                    <div class="tv-auth-buttons">
                        <a href="login.html" class="tv-btn tv-btn-outline">
                            Đăng nhập
                        </a>

                        <a
                            href="register.html"
                            class="tv-btn tv-btn-red"
                            aria-current="page"
                        >
                            Đăng ký
                        </a>
                    </div>

                    <div class="tv-account-menu">
                        <span class="tv-avatar" data-tv-user-initial>V</span>

                        <span
                            class="tv-account-name"
                            data-tv-user-name
                        >Người dùng</span>

                        <a href="profile.html" class="tv-btn tv-btn-outline">
                            Tài khoản
                        </a>

                        <a
                            href="index.html"
                            class="tv-btn tv-btn-outline"
                            data-tv-logout
                        >
                            Đăng xuất
                        </a>
                    </div>

                </div>
            </div>
        </div>
    </header>

    <!-- NỘI DUNG ĐĂNG KÝ -->
    <main class="tv-register-page">
        <div class="tv-register-wrapper">

            <section class="tv-register-card">

                <div class="tv-register-header">
                    <h1 class="tv-register-title">Tạo tài khoản</h1>

                    <p class="tv-register-subtitle">
                        Đăng ký tài khoản để bắt đầu xem phim trên TV
                    </p>
                </div>

                <form id="registerForm" novalidate>

                    <div class="tv-register-field">
                        <label for="register-name" class="tv-register-label">
                            Họ và tên
                        </label>

                        <input
                            type="text"
                            id="register-name"
                            name="name"
                            class="tv-register-input"
                            placeholder="Nhập họ và tên"
                            autocomplete="name"
                        >

                        <div
                            id="register-name-error"
                            class="tv-register-error"
                        ></div>
                    </div>

                    <div class="tv-register-field">
                        <label for="register-email" class="tv-register-label">
                            Email
                        </label>

                        <input
                            type="email"
                            id="register-email"
                            name="email"
                            class="tv-register-input"
                            placeholder="example@gmail.com"
                            autocomplete="email"
                        >

                        <div
                            id="register-email-error"
                            class="tv-register-error"
                        ></div>
                    </div>

                    <div class="tv-register-field">
                        <label
                            for="register-password"
                            class="tv-register-label"
                        >
                            Mật khẩu
                        </label>

                        <div class="tv-register-password-wrapper">
                            <input
                                type="password"
                                id="register-password"
                                name="password"
                                class="tv-register-input"
                                placeholder="Nhập mật khẩu"
                                autocomplete="new-password"
                            >

                            <button
                                type="button"
                                id="registerPasswordToggle"
                                class="tv-register-password-toggle"
                                aria-label="Hiện hoặc ẩn mật khẩu"
                            >
                                Hiện
                            </button>
                        </div>

                        <div
                            id="register-password-error"
                            class="tv-register-error"
                        ></div>
                    </div>

                    <div class="tv-register-field">
                        <label
                            for="register-confirm-password"
                            class="tv-register-label"
                        >
                            Nhập lại mật khẩu
                        </label>

                        <div class="tv-register-password-wrapper">
                            <input
                                type="password"
                                id="register-confirm-password"
                                name="confirmPassword"
                                class="tv-register-input"
                                placeholder="Nhập lại mật khẩu"
                                autocomplete="new-password"
                            >

                            <button
                                type="button"
                                id="registerConfirmPasswordToggle"
                                class="tv-register-password-toggle"
                                aria-label="Hiện hoặc ẩn mật khẩu xác nhận"
                            >
                                Hiện
                            </button>
                        </div>

                        <div
                            id="register-confirm-password-error"
                            class="tv-register-error"
                        ></div>
                    </div>

                    <div
                        id="register-success"
                        class="tv-register-success"
                        role="status"
                        aria-live="polite"
                    ></div>

                    <button type="submit" class="tv-register-submit">
                        Đăng ký
                    </button>

                </form>

                <div class="tv-register-login">
                    <span>Đã có tài khoản?</span>
                    <a href="login.html">Đăng nhập</a>
                </div>

            </section>
        </div>
    </main>

    <!-- FOOTER GIỐNG CẤU TRÚC CHUNG -->
    <footer class="tv-footer">
        <div class="tv-container">
            <div class="tv-footer-inner">

                <div>
                    <a href="index.html" class="tv-footer-brand">
                        <span class="tv-logo">TV</span>
                        <span>TV</span>
                    </a>

                    <p class="tv-footer-text mt-2 mb-0">
                        Website xem phim trực tuyến.
                    </p>
                </div>

                <p class="tv-footer-copy mb-0">
                    © 2026 TV. Viễn
                </p>

            </div>
        </div>
    </footer>

    <script src="js/auth.js"></script>
</body>

</html>
